services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: recipe_app
    restart: unless-stopped
    # Security Hardening:
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Bind strictly to localhost so public internet traffic cannot bypass Nginx
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-recipe_db}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_backend
      - nginx_default
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.20"
          memory: 128M

  db:
    image: postgres:16-alpine
    container_name: recipe_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-recipe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose Postgres ONLY to host localhost (127.0.0.1).
      # Completely blocked from the internet, but allows local host scripts & SSH tunnels
      - "127.0.0.1:5432:5432"
    networks:
      - internal_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-recipe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
    name: recipe_postgres_data

networks:
  internal_backend:
    driver: bridge
  nginx_default:
    external: true
