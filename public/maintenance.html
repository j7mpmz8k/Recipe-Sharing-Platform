<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance - Recipe Sharing Platform</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-body: #475569;
            --text-muted: #94a3b8;
            --badge-bg: #fef3c7;
            --badge-text: #92400e;
            --badge-border: #fde68a;
            --btn-bg: #ea580c;
            --btn-hover: #c2410c;
            --btn-text: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --card-border: #334155;
                --text-title: #f8fafc;
                --text-body: #cbd5e1;
                --text-muted: #64748b;
                --badge-bg: #451a03;
                --badge-text: #fde68a;
                --badge-border: #78350f;
                --btn-bg: #f97316;
                --btn-hover: #ea580c;
                --btn-text: #ffffff;
                --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .maintenance-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 520px;
            width: 100%;
            padding: 2.75rem 2.25rem;
            text-align: center;
            transition: all 0.2s ease-in-out;
        }

        .chef-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        h1 {
            color: var(--text-title);
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 0.85rem;
        }

        p {
            font-size: 1rem;
            color: var(--text-body);
            margin-bottom: 1.75rem;
        }

        .btn-refresh {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.75rem 1.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            text-decoration: none;
        }

        .btn-refresh:hover {
            background-color: var(--btn-hover);
        }

        .btn-refresh:active {
            transform: scale(0.98);
        }

        .support-info {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.825rem;
            color: var(--text-muted);
        }

        .support-info a {
            color: var(--btn-bg);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="chef-icon" aria-hidden="true">🍳</div>
        <div>
            <span class="status-badge">
                <span class="status-dot"></span>
                Scheduled Maintenance
            </span>
        </div>
        <h1>Cooking Up Something Fresh!</h1>
        <p>
            The Recipe Sharing Platform is temporarily offline for scheduled system updates and maintenance. We'll be back online in just a few minutes.
        </p>
        <button type="button" class="btn-refresh" onclick="window.location.reload();">
            🔄 Check Again
        </button>
        <div class="support-info">
            Questions or urgent requests? Reach out to <a href="mailto:contact@recipes.jcardon.me">contact@recipes.jcardon.me</a>
        </div>
    </div>
</body>
</html>
